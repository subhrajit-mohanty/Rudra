[tool.poetry]
name = "rudra"
version = "1.1.0"
description = "Open-source managed authentication platform powered by Keycloak"
authors = ["Rudra Contributors"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/rudra-auth/rudra"
repository = "https://github.com/rudra-auth/rudra"
keywords = ["auth", "keycloak", "sso", "oidc", "saml", "mfa", "rbac"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]
packages = [
    { include = "rudra_sdk", from = "sdk/python" },
]

[tool.poetry.dependencies]
python = "^3.10"
# Backend. Same pins as backend/requirements.txt; keep the two in sync
# until FND-10 makes one of them authoritative.
fastapi = "0.141.1"
starlette = "1.6.0"
uvicorn = { version = "0.32.1", extras = ["standard"] }
motor = "3.6.0"
pymongo = "4.9.2"
httpx = "0.28.1"
pyjwt = "2.14.0"
pydantic = "2.10.3"
redis = { version = "5.2.1", extras = ["hiredis"] }
# SDK
requests = "^2.28.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
pytest-asyncio = "^1.4"
# Pinned so CI lints with the same ruff release contributors run locally.
ruff = "0.16.8"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E701", "E702"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["backend", "sdk/python"]
markers = [
    "integration: tests that require a running MongoDB service.",
]